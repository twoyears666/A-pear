name: iOS Build

# 引擎 App（PojavLauncher）iOS 编译：拉子模块 → xcodebuild 无签名编译 →
# 打包成可侧载 .ipa 并上传工件。runner 用 macOS 自带 Xcode。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa (sideload)
    runs-on: macos-14
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode version
        run: xcodebuild -version

      - name: Enumerate schemes
        run: xcodebuild -project Amethyst.xcodeproj -list

      - name: Build (unsigned)
        run: |
          xcodebuild -project Amethyst.xcodeproj \
            -scheme PojavLauncher \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .ipa for sideload
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP" || { echo "未找到 .app，编译可能失败"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PojavLauncher-unsigned.ipa Payload
          echo "→ PojavLauncher-unsigned.ipa"
          ls -lh PojavLauncher-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-unsigned
          path: PojavLauncher-unsigned.ipa
          if-no-files-found: error